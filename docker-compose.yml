services:
  cogswell-lib-unb-ca:
    build:
      target: development
      context: .
    container_name: cogswell-lib-unb-ca
    volumes:
      - ./.nuxt:/nuxt/.nuxt
      - ./app:/nuxt/app
      - ./content:/nuxt/content
      - ./public:/nuxt/public
      - ./content.config.ts:/nuxt/content.config.ts
      - ./nuxt.config.ts:/nuxt/nuxt.config.ts
      - ./package.json:/nuxt/package.json
      - ./pnpm-lock.yaml:/nuxt/pnpm-lock.yaml
    environment:
      NUXT_SITE_URI: ${NUXT_SITE_URI}
      NUXT_PORT: ${NUXT_PORT}
    ports:
      - '3086:3086'
      - '30860:30860'
    networks:
      - cogswell.lib.unb.ca

networks:
  cogswell.lib.unb.ca:
    name: cogswell.lib.unb.ca
